<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pause – scroll less, live more</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EAF3F2;--card:#fff;--ink:#12303A;--mute:#5B747A;--line:#CFE0DF;--acc:#1F7A7A;--accT:#fff;--warn:#C2512F;--ok:#2E8B57;--fs:1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1E22;--card:#172B30;--ink:#E6F2F1;--mute:#93AEB2;--line:#27434A;--acc:#52C0B8;--accT:#08201F;--warn:#FF8A63;--ok:#6CD39A}}
:root[data-theme="dark"]{--bg:#0F1E22;--card:#172B30;--ink:#E6F2F1;--mute:#93AEB2;--line:#27434A;--acc:#52C0B8;--accT:#08201F;--warn:#FF8A63;--ok:#6CD39A}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:calc(18px*var(--fs));line-height:1.5}
main{max-width:520px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:1.5em;margin:0 0 4px}h2{font-size:1.15em;margin:0 0 10px}
p{margin:0 0 12px}.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{background:var(--acc);color:var(--accT);border:0;border-radius:14px;padding:14px 18px;font-weight:700;min-height:48px}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.full{width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:2px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;min-height:44px}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accT);border-color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:80px}
.ring{position:relative;width:210px;height:210px;margin:6px auto 14px}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.big{font-size:2.6em;font-weight:700;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:520px;width:100%}
nav button{flex:1;background:none;border:0;padding:12px 4px;min-height:60px;color:var(--mute);font-weight:700}
nav button[aria-selected=true]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.log{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;position:relative;margin:10px 0 4px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar i{display:block;width:100%;border-radius:8px 8px 0 0;background:var(--acc);min-height:3px}
.bar i.over{background:var(--warn)}
.lbls{display:flex;gap:8px;text-align:center;font-size:.8em;color:var(--mute)}.lbls span{flex:1}
.limit{position:absolute;left:0;right:0;border-top:2px dashed var(--mute);pointer-events:none}
.breath{width:200px;height:200px;margin:18px auto;border-radius:50%;background:var(--acc);color:var(--accT);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.2em;transform:scale(.55);transition:transform 4s ease-in-out;text-align:center}
.stats{display:flex;gap:10px}.stats div{flex:1;text-align:center}.stats b{display:block;font-size:1.8em}
.hide{display:none}
select{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%;min-height:48px}
label{display:block;font-weight:700;margin:12px 0 6px}
@media (prefers-reduced-motion:reduce){.breath{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav><div role="tablist" aria-label="Sections">
<button role="tab" data-t="today">Today</button>
<button role="tab" data-t="pause">Pause</button>
<button role="tab" data-t="week">Week</button>
<button role="tab" data-t="me">Settings</button>
</div></nav>
<script>
var KEY='pause_v1',APPS=['Instagram','YouTube','WhatsApp','Facebook','X','Snapchat','Reels/Shorts','Other'];
var PROF={child:{n:'Child (under 13)',lim:45,fs:1.1,say:'Great job'},teen:{n:'Teen (13–19)',lim:90,fs:1,say:'Nice one'},adult:{n:'Adult (20–59)',lim:120,fs:1,say:'Well done'},senior:{n:'Senior (60+)',lim:90,fs:1.2,say:'Well done'}};
var S={profile:null,limit:null,theme:'auto',log:{},urges:{}},tab='today',pick='Instagram';
try{var r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dk(d){d=d||new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function day(k){return S.log[k||dk()]||(S.log[k||dk()]={total:0,e:[]})}
function fmt(m){m=Math.max(0,Math.round(m));var h=Math.floor(m/60);return h?h+'h '+(m%60)+'m':m+' min'}
function applyLook(){var p=PROF[S.profile]||PROF.adult;document.documentElement.style.setProperty('--fs',p.fs);
if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme)}
function streak(){var n=0,d=new Date();var t=S.log[dk(d)];if(!t||t.total>S.limit){} 
for(var i=(t&&t.total<=S.limit)?0:1;i<400;i++){var x=new Date();x.setDate(x.getDate()-i);var l=S.log[dk(x)];if(l&&l.total<=S.limit)n++;else break}return n}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}

function render(){applyLook();
document.querySelectorAll('nav button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.t===tab)});
var a=document.getElementById('app');
if(!S.profile){a.innerHTML=welcome();return}
a.innerHTML=({today:vToday,pause:vPause,week:vWeek,me:vMe})[tab]();
if(tab==='pause')breathReset();window.scrollTo(0,0)}

function welcome(){return '<h1>Welcome to Pause</h1><p class="mute">A calm way to spend less time on social media. Who is this for?</p><div class="card">'+
Object.keys(PROF).map(function(k){return '<button class="btn alt full" style="margin-bottom:10px" onclick="start(\''+k+'\')">'+PROF[k].n+'</button>'}).join('')+
'<p class="mute" style="margin:0">You can change everything later. Your data stays on this device.</p></div>'}
function start(k){S.profile=k;S.limit=PROF[k].lim;save();tab='today';render()}

function vToday(){var d=day(),left=S.limit-d.total,pct=Math.min(1,d.total/S.limit),over=left<0,C=2*Math.PI*90;
var msg=over?'You are '+fmt(-left)+' over today. Put the phone down for now — tomorrow is a fresh start.':pct>.75?'Almost at your limit. Maybe stop here?':d.total===0?'Nothing logged yet. Log your time after each session.':'You are doing fine. Keep it up.';
return '<h1>Today</h1><p class="mute">Your daily limit is '+fmt(S.limit)+'.</p><div class="card"><div class="ring"><svg width="210" height="210" viewBox="0 0 210 210"><circle cx="105" cy="105" r="90" fill="none" stroke="var(--line)" stroke-width="16"/><circle cx="105" cy="105" r="90" fill="none" stroke="'+(over?'var(--warn)':'var(--acc)')+'" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+(C*(1-pct))+'"/></svg><div class="c"><span class="big">'+(over?'+'+fmt(-left):fmt(left))+'</span><span class="mute">'+(over?'over limit':'left today')+'</span></div></div><p style="text-align:center;margin:0">'+msg+'</p></div>'+
'<div class="card"><h2>Log a session</h2><div class="chips" role="group" aria-label="App">'+APPS.map(function(x){return '<button class="chip" aria-pressed="'+(x===pick)+'" onclick="pick=\''+x+'\';render()">'+x+'</button>'}).join('')+'</div><p class="mute" style="margin-bottom:8px">How long did you use '+esc(pick)+'?</p><div class="row"><button class="btn" onclick="add(5)">+5 min</button><button class="btn" onclick="add(15)">+15 min</button><button class="btn" onclick="add(30)">+30 min</button><button class="btn" onclick="add(60)">+1 hour</button></div></div>'+
'<div class="card"><h2>Today’s log</h2>'+(d.e.length?d.e.map(function(x,i){return '<div class="log"><span>'+esc(x[0])+' · '+fmt(x[1])+'</span><button class="btn alt" onclick="undo('+i+')" aria-label="Remove this entry">Remove</button></div>'}).join(''):'<p class="mute" style="margin:0">No sessions yet.</p>')+'</div>'}
function add(m){var d=day();d.e.push([pick,m]);d.total+=m;save();render()}
function undo(i){var d=day();d.total-=d.e[i][1];d.e.splice(i,1);save();render()}

var bt=null,bc=0;
function vPause(){var u=S.urges[dk()]||0;
return '<h1>Pause</h1><p class="mute">Feeling the pull to scroll? Take one minute first. Most urges fade in a few breaths.</p><div class="card" style="text-align:center"><div id="b" class="breath" aria-live="polite">Ready?</div><button id="go" class="btn full" onclick="breathe()">Start breathing</button>'+
'<div id="after" class="hide" style="text-align:left;margin-top:16px"><h2>Do something else for 10 minutes</h2><ul style="padding-left:20px;margin:0 0 14px"><li>Drink a glass of water</li><li>Step outside or stretch</li><li>Call or message someone you love</li><li>Read a page of a book</li></ul><div class="row"><button class="btn" onclick="resist()">I will skip it</button><button class="btn alt" onclick="breathReset();render()">Scroll anyway</button></div></div></div><p class="mute" style="text-align:center">Urges resisted today: <b style="color:var(--ink)">'+u+'</b></p>'}
function breathReset(){clearTimeout(bt);bc=0}
function breathe(){var b=document.getElementById('b'),g=document.getElementById('go');g.classList.add('hide');bc=0;
(function cyc(){if(bc>=4){b.style.transform='scale(.55)';b.textContent='Well done';document.getElementById('after').classList.remove('hide');return}
b.style.transform='scale(1)';b.textContent='Breathe in';
bt=setTimeout(function(){b.textContent='Breathe out';b.style.transform='scale(.55)';bt=setTimeout(function(){bc++;cyc()},4000)},4000)})()}
function resist(){S.urges[dk()]=(S.urges[dk()]||0)+1;save();breathReset();var a=document.getElementById('app');a.innerHTML='<div class="card" style="text-align:center;margin-top:30px"><h1>'+(PROF[S.profile]||PROF.adult).say+'!</h1><p>That was one urge you let pass. Every one makes the next easier.</p><button class="btn full" onclick="tab=\'today\';render()">Back to today</button></div>'}

function vWeek(){var days=[],tot=0,under=0,max=S.limit;
for(var i=6;i>=0;i--){var x=new Date();x.setDate(x.getDate()-i);var l=S.log[dk(x)];var m=l?l.total:0;days.push({l:['Su','Mo','Tu','We','Th','Fr','Sa'][x.getDay()],m:m});tot+=m;if(m>max)max=m;if(l&&m<=S.limit)under++}
max=max*1.1;var ur=0;Object.keys(S.urges).forEach(function(k){ur+=S.urges[k]});
var avg=tot/7;
return '<h1>This week</h1><div class="card"><div class="bars">'+days.map(function(d){return '<div class="bar"><i class="'+(d.m>S.limit?'over':'')+'" style="height:'+(d.m/max*100)+'%" title="'+fmt(d.m)+'"></i></div>'}).join('')+'<div class="limit" style="bottom:'+(S.limit/max*100)+'%"></div></div><div class="lbls">'+days.map(function(d){return '<span>'+d.l+'</span>'}).join('')+'</div><p class="mute" style="margin:10px 0 0">Dashed line = your limit ('+fmt(S.limit)+'). Red bars went over.</p></div>'+
'<div class="card stats"><div><b>'+streak()+'</b><span class="mute">day streak under limit</span></div><div><b>'+fmt(avg)+'</b><span class="mute">daily average</span></div><div><b>'+ur+'</b><span class="mute">urges resisted</span></div></div>'+
'<div class="card"><p style="margin:0">'+(under>=5?'Excellent week. You stayed under your limit on '+under+' of 7 days.':under>=3?'Good progress. Try to add one more day under your limit.':'Small steps count. Try lowering your limit by 10 minutes.')+'</p></div>'}

function vMe(){var o=Object.keys(PROF).map(function(k){return '<option value="'+k+'"'+(k===S.profile?' selected':'')+'>'+PROF[k].n+'</option>'}).join('');
return '<h1>Settings</h1><div class="card"><label for="p">Who is using this</label><select id="p" onchange="S.profile=this.value;S.limit=PROF[this.value].lim;save();render()">'+o+'</select>'+
'<label for="l">Daily limit: <span id="lv">'+fmt(S.limit)+'</span></label><input id="l" type="range" min="15" max="300" step="15" value="'+S.limit+'" style="width:100%;height:36px;accent-color:var(--acc)" oninput="document.getElementById(\'lv\').textContent=fmt(+this.value)" onchange="S.limit=+this.value;save()">'+
'<label for="t">Look</label><select id="t" onchange="S.theme=this.value;save();applyLook()"><option value="auto"'+(S.theme==='auto'?' selected':'')+'>Match my device</option><option value="light"'+(S.theme==='light'?' selected':'')+'>Light</option><option value="dark"'+(S.theme==='dark'?' selected':'')+'>Dark</option></select></div>'+
'<div class="card"><h2>Tips that work</h2><ul style="padding-left:20px;margin:0"><li>Keep your phone out of the bedroom at night.</li><li>Turn off notifications for social apps.</li><li>Move social apps off your home screen.</li><li>Set a fixed time for scrolling, then stop.</li></ul></div>'+
'<button class="btn alt full" onclick="if(confirm(\'Delete all your data from this device?\')){S={profile:null,limit:null,theme:\'auto\',log:{},urges:{}};save();render()}">Reset all data</button>'}

document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){breathReset();tab=b.dataset.t;render()}});
render();
</script>
</body>
</html>
